    }

    .seo-loading {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
      background: linear-gradient(180deg, #0b2c47 0%, #1c5a88 100%);

    }

    .seo-loading h1 {

      font-size: clamp(28px, 5vw, 48px);
      line-height: 1.1;
    }

    .seo-loading p {
      margin: 0;
      font-size: 17px;

<body>
  <main id="seo-loading" class="seo-loading" aria-label="IPTkiganjani">

      <p>Tanzania internship, field practical training, university coordination, and organization recruitment platform.</p>

  <noscript>

    </main>
  </noscript>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('seo-loading');
      if (loading) {
        loading.remove();
      }
    });
  </script>
