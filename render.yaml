services:
  - type: web
    name: student-job-platform-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: PUBLIC_API_URL
        value: https://student-job-platform-api.onrender.com
      - key: RESET_PASSWORD_BASE_URL
        value: https://student-job-platform-api.onrender.com
      - key: ALLOWED_ORIGINS
        value: ""
      - key: BREVO_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: Student Job Platform <onboarding@resend.dev>
      - key: RESEND_REPLY_TO
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: PASSWORD_RESET_TOKEN_TTL_MINUTES
        value: 60
      - key: BOOTSTRAP_ADMIN_EMAILS
        value: ""
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_FULL_NAME
        value: System Administrator
      - key: BOOTSTRAP_ADMIN_PHONE
        value: ""
      - key: ROLE_SYNC_OVERRIDES
        value: "amostangawizi800@gmail.com:admin"
      - key: EXPOSE_RESET_DEBUG_LINKS
        value: "false"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
  - type: web
    name: student-job-platform-web
    runtime: static
    buildCommand: bash scripts/render_build_flutter_web.sh
    staticPublishPath: ./student_app/build/web
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: API_BASE_URL
        value: https://student-job-platform-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
